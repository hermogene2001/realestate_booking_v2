databases:
  - name: realestate-db
    plan: free
    databaseName: realestate_booking
    user: realestate_user

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: realestate-booking-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npx tsc -p tsconfig.json
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: FRONTEND_URL
        value: https://realestate-booking-frontend.onrender.com
      - key: CORS_ORIGIN
        value: https://realestate-booking-frontend.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: LOG_LEVEL
        value: info
      # Email — fill in after deploy
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false   # set manually in dashboard
      - key: SMTP_PASS
        sync: false   # set manually in dashboard
      - key: SMTP_FROM_EMAIL
        value: noreply@kigali-re.com
      # AI — set whichever you use
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_ENABLED
        value: "false"
      # Blockchain — optional, leave blank to disable
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: ADMIN_WALLET_PRIVATE_KEY
        sync: false

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: realestate-booking-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npx next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://realestate-booking-api.onrender.com/api
      # Blockchain vars — leave blank to disable on-chain features
      - key: NEXT_PUBLIC_CONTRACT_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_CHAIN_ID
        sync: false
      - key: NEXT_PUBLIC_HARDHAT_RPC
        sync: false
