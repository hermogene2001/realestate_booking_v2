name: kigali_re
description: Kigali Real Estate Booking - Flutter Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  web3dart: ^2.7.3
  web_socket_channel: ^2.4.0
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.4
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
